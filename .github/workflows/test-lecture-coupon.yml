# Kateni — test de la lecture d'une capture de coupon dans un environnement Linux comme Streamlit Cloud.
# Deux cas : avec Tesseract (installé par packages.txt) et SANS (le lecteur de secours RapidOCR doit prendre le relais).
name: Test lecture coupon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lecteur: [tesseract, secours]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lecteur de texte (comme packages.txt sur Streamlit Cloud)
        if: matrix.lecteur == 'tesseract'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $(cat packages.txt)
      - name: Dépendances
        run: pip install -q -r requirements.txt
      - name: Lecture du faux coupon
        run: python scripts/essai_lecture_coupon.py

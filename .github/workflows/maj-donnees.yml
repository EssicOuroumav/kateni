# Kateni — mise à jour automatique des données (résultats, calendrier, coupes d'Europe, basket)
# Tourne deux fois par jour ; enregistre les CSV modifiés, ce qui met à jour l'app en ligne.
# Un seul secret : ODDS_API_KEY (cotes Pinnacle), transmis uniquement à l'étape qui en a besoin.
name: Mise à jour des données

on:
  schedule:
    - cron: "15 5 * * *"    # 05:15 UTC (05:15 à Abidjan) : résultats de la veille
    - cron: "15 14 * * *"   # 14:15 UTC : calendrier et cotes du jour
  workflow_dispatch: {}     # lancement à la main depuis GitHub (onglet Actions)

permissions:
  contents: write           # uniquement pour enregistrer les CSV dans ce dépôt

concurrency:
  group: kateni-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances (versions figées)
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Championnats et calendrier (football-data.co.uk)
        run: python scripts/maj_donnees.py
      - name: Coupes d'Europe (Wikipédia)
        run: python scripts/maj_europe.py
      - name: Basket (NBA via ESPN, EuroLeague et EuroCup via l'API officielle)
        run: python scripts/maj_basket.py
      - name: Cotes Pinnacle du matin (C1/C3 du jour et du lendemain)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/maj_cotes.py --mode matin
      - name: Vérifications avant d'enregistrer
        run: python -m pytest -q tests -k "not neon"
      - name: Enregistrer les données si elles ont changé
        run: |
          git config user.name "kateni-bot"
          git config user.email "kateni-bot@users.noreply.github.com"
          git add -- *_full.csv basket_resultats.csv basket_a_venir.csv a_venir.csv a_venir_championnats.csv calendrier_saison.csv buts_minutes.csv cotes_pinnacle.csv oddspapi_equipes.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données : mise à jour automatique du $(date -u +%d/%m/%Y\ %H:%M) UTC"
            git pull --rebase
            git push
          fi

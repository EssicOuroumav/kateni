[server]
# L'adresse d'écoute « localhost » est imposée par le lanceur du Mac (Lancer_Kateni.command,
# --server.address=localhost) et non ici : sur Streamlit Cloud, l'app doit écouter normalement.
# Pas de port ici non plus : Streamlit Cloud impose le sien (8501 reste le défaut sur le Mac).
headless = true

[client]
# En cas de plantage d'une page : le type d'erreur seulement, sans fichiers ni détails techniques
# (le détail complet reste dans les journaux de Streamlit Cloud, visibles par le propriétaire seul)
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[theme]
# Charte « Nuit de match » (choix du propriétaire, 08/11/2026) : stade la nuit sous les projecteurs.
# Fond très sombre, cartes ardoise, vert gazon électrique pour l'action, rouge Kateni pour la marque.
base = "dark"
primaryColor = "#39E58A"
backgroundColor = "#0B0F0D"
secondaryBackgroundColor = "#1B241F"
textColor = "#E9F0EB"
linkColor = "#39E58A"
borderColor = "#24302A"
dataframeBorderColor = "#24302A"
dataframeHeaderBackgroundColor = "#121915"
redColor = "#FF4D4D"
greenColor = "#39E58A"
orangeColor = "#FFB547"
blueColor = "#5BC0FF"
grayColor = "#9FB0A5"
headingFont = "'Oxanium':https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap"
headingFontWeights = [800, 700, 700, 700, 600, 600]
font = "'Nunito Sans':https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
metricValueFontWeight = 800
baseRadius = "large"
chartCategoricalColors = ["#39E58A", "#FF4D4D", "#5BC0FF", "#FFB547", "#9FB0A5", "#E9F0EB"]
chartSequentialColors = ["#0F2A1C", "#123A25", "#164B2F", "#1A5D39", "#1F7044", "#24844F", "#2A985B", "#30AD67", "#35C374", "#39E58A"]
